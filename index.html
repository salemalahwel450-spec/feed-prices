html{direction:rtl}

.field input,.field select,.field textarea{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%}

.modal{position:fixed;inset:0;z-index:60;background:rgba(10,18,13,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px 16px 0}

  var w=t.value==='weight', d=$('#f-du').value;
  $('#f-w').style.display=w?'grid':'none';
  $('#f-h').style.display=w?'none':'block';
  $('#f-bale').style.display=d==='bale'?'grid':'none';
  $('#f-sack').style.display=d==='sack'?'grid':'none';
}
function saveItem(id){
  var name=$('#f-name').value.trim(); if(!name){toast('اكتب اسم الصنف');return}
  var brand=$('#f-brand').value.trim();
  if(D.items.some(function(i){return i.id!==id&&i.name===name&&(i.brand||'')===brand})){toast('هذا الصنف موجود بنفس الاسم والشركة');return}
  var type=$('#f-type').value, du=$('#f-du').value;
  var o={name:name,brand:brand,type:type,pQt:+$('#f-pqt').value||0,pKg:+$('#f-pkg').value||0,pSack:+$('#f-psack').value||0,pBale:+$('#f-pbale').value||0,avail:$('#f-av').checked};
  if(type==='weight'){o.pSack=0;o.pBale=0;delete o.du}else{o.pQt=0;o.pKg=0;o.du=du;if(du==='bale')o.pSack=0;else o.pBale=0}
  if(id){var it=D.items.filter(function(i){return i.id===id})[0];
    if(it.name!==name&&D.imgs[it.name]&&!D.items.some(function(x){return x.id!==id&&x.name===it.name})){D.imgs[name]=D.imgs[name]||D.imgs[it.name];delete D.imgs[it.name]}
    Object.assign(it,o)}
  else{o.id=uid();D.items.push(o)}
  save();closeModal();renderList();
}

/* ---------- images ---------- */
function toJpeg(file,cb){
  var r=new FileReader();
  r.onload=function(){var im=new Image();
    im.onload=function(){var m=720,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.78))};
    im.onerror=function(){cb(null)};im.src=r.result};
  r.onerror=function(){cb(null)};r.readAsDataURL(file);
}
function pickImage(name){
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=function(){var f=inp.files&&inp.files[0];if(!f)return;
    toJpeg(f,function(u){if(!u){toast('تعذر قراءة الصورة');return}D.imgs[name]=u;save();renderList();toast('تمت إضافة الصورة')})};
  inp.click();
}

/* ---------- import / publish ---------- */
function importCashier(){
  try{var d=JSON.parse($('#m-imp').value);if(!d||!Array.isArray(d.items))throw 0;
    D.items=d.items.filter(function(i){return i&&i.name}).map(function(i){
      return {id:uid(),name:String(i.name),brand:String(i.brand||''),type:i.type==='hay'?'hay':'weight',du:i.du==='sack'?'sack':'bale',
        pQt:+i.pQt||0,pKg:+i.pKg||0,pSack:+i.pSack||0,pBale:+i.pBale||0,avail:i.avail!==false}});
    save();$('#m-imp').value='';toast('تم الاستيراد: '+D.items.length+' صنف');
  }catch(e){toast('النص غير صالح')}
}
function buildDoc(){
  var rs=document.head.querySelector('style'), vp=document.head.querySelector('meta[name="viewport"]');
  var json=dataJson();
  var body='<title>'+esc(document.title)+'</title>'+$('meta[name="claude:viewport-fit-sides"]').outerHTML+$('link[href*="fonts.googleapis.com"]').outerHTML
    +'<style id="appstyle">'+$('#appstyle').textContent+'</style><div id="root"></div>'
    +'<script type="application/json" id="data">'+json+'<\/script><script id="app">'+$('#app').textContent+'<\/script>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="'+(vp?vp.getAttribute('content'):'width=device-width,initial-scale=1,viewport-fit=cover')+'"><style>'+(rs?rs.textContent:'')+'</style></head><body>'+body+'</body></html>';
}
function dataJson(){return JSON.stringify(D).split('<').join('\\u003c').split(String.fromCharCode(8232)).join('\\u2028').split(String.fromCharCode(8233)).join('\\u2029')}
function buildSite(){
  var t=esc((D.shop.name||'أصناف الأعلاف')+' - الأصناف والأسعار');
  return '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>'+t+'</title>'
    +'<meta name="description" content="'+esc('أسعار وتوفر الأعلاف في '+(D.shop.name||'المحل'))+'">'
    +$('link[href*="fonts.googleapis.com"]').outerHTML+'<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>'
    +'<style id="appstyle">'+$('#appstyle').textContent+'</style></head><body><div id="root"></div>'
    +'<script type="application/json" id="data">'+dataJson()+'<\/script><script id="app">'+$('#app').textContent+'<\/script></body></html>';
}
async function downloadSite(){
  try{var dl=await claude.use('downloads');if(!dl){toast('التنزيل غير متاح هنا. استخدم زر نسخ الكود');return}
    await dl.save({filename:'index.html',data:buildSite()});toast('تم حفظ الملف')}
  catch(e){if(!(e&&e.code==='declined'))toast('تعذر التنزيل. استخدم زر نسخ الكود')}
}
function copySite(){
  try{navigator.clipboard.writeText(buildSite()).then(function(){toast('تم نسخ الكود. الصقه في ملف index.html')},function(){toast('تعذر النسخ')})}
  catch(e){toast('تعذر النسخ')}
}
async function publish(){
  try{
    var art=await claude.use('artifact'); if(!art){toast('النشر غير متاح');return}
    toast('جار النشر…');
    await art.publish(buildDoc());
  }catch(e){
    var c=e&&e.code;
    toast(c==='conflict'?'تعذر النشر لوجود نسخة أحدث. سيُعاد تحميل الصفحة':(c==='not_writer'||c==='not_granted'?'ليس لديك صلاحية النشر':'تعذر النشر، حاول مرة أخرى'));
  }
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('button'); if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;return render()}
  if(t.dataset.cat){cat=t.dataset.cat;return render()}
  if(t.dataset.edit)return openItem(t.dataset.edit);
  if(t.dataset.img)return pickImage(decodeURIComponent(t.dataset.img));
  if(t.dataset.rmimg){delete D.imgs[decodeURIComponent(t.dataset.rmimg)];save();return renderList()}
  if(t.dataset.addco){var n=decodeURIComponent(t.dataset.addco),b=D.items.filter(function(i){return i.name===n})[0];
    return openItem(null,{name:n,brand:'',type:b.type,du:b.du,pQt:b.pQt,pKg:b.pKg,pSack:b.pSack,pBale:b.pBale,avail:true})}
  var a=t.dataset.act; if(!a)return;
  if(a==='new')openItem(null);
  else if(a==='save-item')saveItem(t.dataset.id);
  else if(a==='close')closeModal();
  else if(a==='ask-del')$('#del-box').innerHTML='<div class="note" style="margin:0">سيُحذف الصنف من القائمة.</div><button class="btn danger" style="margin-top:8px" data-act="do-del" data-id="'+t.dataset.id+'">نعم، احذف</button>';
  else if(a==='do-del'){D.items=D.items.filter(function(i){return i.id!==t.dataset.id});save();closeModal();renderList()}
  else if(a==='import')importCashier();
  else if(a==='publish')publish();
  else if(a==='dl-site')downloadSite();
  else if(a==='copy-site')copySite();
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){query=t.value.trim();renderList()}
  else if(t.id==='m-name'){D.shop.name=t.value;save()}
  else if(t.id==='m-phone'){D.shop.phone=t.value;save()}
  else if(t.id==='m-wa'){D.shop.wa=t.value;save()}
  else if(t.id==='m-note'){D.shop.note=t.value;save()}
});
document.addEventListener('change',function(e){if(e.target.id==='f-type'||e.target.id==='f-du')syncForm()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});

render();
/* owner tools light up only for viewers who can edit this page */
(async function(){
  try{
    if(!window.claude||!window.claude.use)return;
    var art=await claude.use('artifact'), user=await claude.use('user');
    if(!art||!user)return;
    var ok=await user.canEdit();
    if(ok){owner=true;render()}
  }catch(e){}
})();
})();
</script></body></html>
